<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BreadFast{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Bread<span>Fast</span></a>
    <nav>
      <a href="/">Student Menu</a>
      <a href="/kitchen">Kitchen Dashboard</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>BreadFast · Sprint 1 prototype</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
